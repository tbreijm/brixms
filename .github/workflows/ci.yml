name: CI

# The green-gate that protects `main` (Build_Plan_v2.md §2 + Ring0_Build_Plan
# §1.10). Holds the determinism discipline: fmt, clippy-as-error, the full test
# suite, frozen-artifact stability, and a supply-chain/license gate must all
# pass. Frozen-artifact drift (canon vectors, oracle/ir insta snapshots) shows
# up as a failing `determinism` or `test` job.
on:
  push:
    branches: [main]
  pull_request:
  merge_group: # merge-queue ready

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  BRIX_TEST_SHARED_TARGET_DIR: ${{ github.workspace }}/target/nested

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # brix-cli's build_run_smoke tests each drive a nested `cargo build` of a
      # generated program that pulls in the full wasmtime/cranelift tree; several
      # of those overrun the stock runner's ~14GB free disk (os error 28). Reclaim
      # the preinstalled toolchains (~20-30GB) we don't use before building.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
      - name: Toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Archive workspace tests
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst
      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
      - name: Run doctests (nextest does not support doctests yet)
        run: cargo test --doc --workspace

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Fetch dependencies (for offline nested builds)
        run: cargo fetch
      - name: Test
        run: cargo nextest run --archive-file nextest-archive.tar.zst

  determinism:
    name: determinism
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Fetch dependencies (for offline nested builds)
        run: cargo fetch
      - name: Run the suite twice; frozen artifacts must not drift
        run: |
          set -euo pipefail
          # This gate only inspects the working tree (git status below). The only
          # crates that emit tracked frozen artifacts are the snapshot/vector
          # producers (brix-conformance/-oracle/-ir, brixc, brix-canon). brix-cli's
          # integration tests instead drive nested `cargo build`s of the generated
          # program (which pulls in the full wasmtime/cranelift tree) into $TMPDIR,
          # so they can't dirty the tree and add nothing here — excluding them
          # drops the dominant cost. The free-disk-space step is moved to build job.
          cargo nextest run --archive-file nextest-archive.tar.zst -E 'not package(brix-cli)'
          # Re-run from the exact same cached output without modifications
          cargo nextest run --archive-file nextest-archive.tar.zst -E 'not package(brix-cli)'
          # Clean up the downloaded archive so it doesn't pollute the git workspace
          rm nextest-archive.tar.zst
          # insta writes *.snap.new only on a snapshot mismatch, and the canon
          # golden-vector test fails outright on drift. Either way the working
          # tree must be byte-identical after repeated runs (proxy for the G3
          # reproducibility gate).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Non-deterministic output / frozen-artifact drift after repeated runs:"
            git status --porcelain
            git --no-pager diff | head -300
            exit 1
          fi
          echo "Frozen artifacts stable across repeated runs."

  conformance:
    name: conformance
    needs: build
    runs-on: ubuntu-latest
    # Already covered by `cargo test --workspace` in the `test` job above;
    # broken out as its own named check (issue #11 / Ring0 §1.10's "starts
    # Day 1, never stops") so oracle == compiled-engine drift has a distinct,
    # always-visible signal as this suite grows (differential fuzz, more
    # fixtures) instead of being buried in the general test job.
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Fetch dependencies (for offline nested builds)
        run: cargo fetch
      - name: Errata fixtures + oracle/compiled-engine differential
        run: cargo nextest run --archive-file nextest-archive.tar.zst -E 'package(brix-conformance)'

  acceptance:
    name: acceptance
    needs: build
    runs-on: ubuntu-latest
    # Already covered by `cargo test --workspace` in the `test` job above;
    # broken out as its own named check (issue #45's "CI fails when spec
    # coverage, support status, or expected diagnostics drift without an
    # explicit fixture update") so the spec-derived acceptance corpus (52
    # spec fixtures + 6 negative fixtures + the committed coverage report)
    # has a distinct, always-visible signal, same rationale as `conformance`.
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Fetch dependencies (for offline nested builds)
        run: cargo fetch
      - name: Spec-derived acceptance corpus (parse/lower/check/phase + negative fixtures + coverage report)
        run: cargo nextest run --archive-file nextest-archive.tar.zst -E 'package(brix-conformance) and binary(acceptance_corpus)'

  reproducibility:
    name: reproducibility
    needs: build
    runs-on: ubuntu-latest
    # Issue #41 (G3): the in-repo proxy for the two-machine reproducibility gate.
    # Deterministic emit (byte-identical generated workspace), cache-integrity
    # fail-closed (a corrupted/incomplete cache entry is rebuilt, never trusted),
    # and deterministic artifact-size budgets. The heavier two-clean-builds
    # byte-identity check is `#[ignore]`d (two full `cargo build`s); the
    # two-machine comparison itself is a release-infra concern (#46), not this
    # job. Broken out as its own signal, same rationale as `conformance`.
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - name: Download nextest archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Fetch dependencies (for offline nested builds)
        run: cargo fetch
      - name: Reproducible emit + cache-integrity + deterministic budgets
        run: cargo nextest run --archive-file nextest-archive.tar.zst -E 'package(brix-cli) and binary(reproducibility)'

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Supply-chain + license gate (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Reported as a code-quality measurement, not a hard gate (no threshold);
    # not a required status check.
    steps:
      - uses: actions/checkout@v7
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
      - name: Toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --summary-only | tee coverage.txt
          {
            echo "### Coverage (workspace)"
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
