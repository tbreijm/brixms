name: Release

# Fires when a version tag is pushed. Re-runs the same green-gate as CI (a
# release must never ship red), builds cross-platform release archives for
# aarch64-apple-darwin and x86_64-unknown-linux-gnu with SHA256 checksums,
# then publishes a GitHub Release for the tag with attached assets.
# Tags carrying a semver pre-release suffix (e.g. `v0.1.0-alpha.3`) are marked
# as pre-releases so they are not surfaced as "latest".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create/edit releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # The merge bar, re-asserted for the exact tagged commit.
      - name: Verify release tag equals workspace version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            echo "ERROR: Release tag '${TAG}' must start with 'v' (e.g. v0.1.0-alpha.3)" >&2
            exit 1
          fi
          TAG_VER="${TAG#v}"
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brix-cli") | .version' | head -n 1)
          echo "Release tag:       ${TAG}"
          echo "Tag version:       ${TAG_VER}"
          echo "Workspace version: ${PKG_VER}"
          if [[ "${TAG_VER}" != "${PKG_VER}" ]]; then
            echo "ERROR: Release tag version '${TAG_VER}' does not equal workspace package version '${PKG_VER}'" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  build-assets:
    name: build-assets (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build brix-cli binary
        run: cargo build --release -p brix-cli --target ${{ matrix.target }}
      - name: Package tar.gz asset and SHA256 file
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="brix-${TAG}-${{ matrix.target }}.tar.gz"
          PKG_DIR=$(mktemp -d)
          trap 'rm -rf "${PKG_DIR}"' EXIT
          STAGE_DIR="${PKG_DIR}/brix-${TAG}-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}/examples"
          cp "target/${{ matrix.target }}/release/brix" "${STAGE_DIR}/brix"
          cp "README.md" "${STAGE_DIR}/README.md"
          cp "LICENSE" "${STAGE_DIR}/LICENSE"
          cp "examples/shipping.brix" "${STAGE_DIR}/examples/shipping.brix"
          cp "examples/shipping-input.brix" "${STAGE_DIR}/examples/shipping-input.brix"
          cp "examples/shipping-input.json" "${STAGE_DIR}/examples/shipping-input.json"
          tar -czf "${ARCHIVE}" -C "${PKG_DIR}" "brix-${TAG}-${{ matrix.target }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          echo "Package created: ${ARCHIVE}"
          cat "${ARCHIVE}.sha256"
      - name: Smoke check release archive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="brix-${TAG}-${{ matrix.target }}.tar.gz"
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "${SMOKE_DIR}"' EXIT
          tar -xzf "${ARCHIVE}" -C "${SMOKE_DIR}"
          TOP_DIR="${SMOKE_DIR}/brix-${TAG}-${{ matrix.target }}"
          if [[ ! -d "${TOP_DIR}" ]]; then
            echo "ERROR: Expected top-level directory '${TOP_DIR}' not found in archive" >&2
            exit 1
          fi
          VERSION_OUTPUT=$("${TOP_DIR}/brix" --version)
          echo "Smoke check output: ${VERSION_OUTPUT}"
          TAG_VER="${TAG#v}"
          if [[ "${VERSION_OUTPUT}" != "brix ${TAG_VER}" ]]; then
            echo "ERROR: Smoke check version '${VERSION_OUTPUT}' does not match expected 'brix ${TAG_VER}'" >&2
            exit 1
          fi
          "${TOP_DIR}/brix" check "${TOP_DIR}/examples/shipping-input.brix" --input "${TOP_DIR}/examples/shipping-input.json"
          "${TOP_DIR}/brix" run "${TOP_DIR}/examples/shipping-input.brix" --input "${TOP_DIR}/examples/shipping-input.json"
          echo "Smoke check passed for ${{ matrix.target }}"
      - name: Upload asset artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            brix-*-${{ matrix.target }}.tar.gz
            brix-*-${{ matrix.target }}.tar.gz.sha256

  publish-release:
    name: publish-release
    needs: [gate, build-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          merge-multiple: true
      - name: Classify pre-release
        id: classify
        run: |
          # Semver pre-release tags contain a hyphen after the version core.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ steps.classify.outputs.prerelease }}
        run: |
          set -euo pipefail
          pre_flag=""
          if [[ "$PRE" == "true" ]]; then pre_flag="--prerelease"; fi
          ASSETS=(brix-${TAG}-*.tar.gz brix-${TAG}-*.tar.gz.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              $pre_flag
          fi
