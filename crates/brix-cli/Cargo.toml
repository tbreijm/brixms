[package]
name = "brix-cli"
description = "The `brix` command-line driver (ADR-0010): `brix check <file.brix>` — parse, lower, and type-check a Brix program, reporting each binding's type + epistemic grade."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "brix"
path = "src/main.rs"

[dependencies]
brix-syntax = { path = "../brix-syntax" }
brix-lower = { path = "../brix-lower" }
brix-elaborate = { path = "../brix-elaborate" }
brix-kernel = { path = "../brix-kernel" }
brix-semantic = { workspace = true }
soc-core = { path = "../soc-core" }
soc-regimes = { path = "../soc-regimes" }

[dev-dependencies]
brix-canon = { workspace = true }

[lints]
workspace = true
